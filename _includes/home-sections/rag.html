{% assign rag = site.data.home.rag %}

<section class="section rag-section">
  <div class="container">
    <div class="rag-section__intro js-anim" data-anim="animate__fadeInUp" data-once="true">
      {% if rag.kicker %}
        <p class="blog-kicker">{{ rag.kicker }}</p>
      {% endif %}
      <h2 class="sec-heading">{{ rag.heading }}</h2>
      <p class="section-intro">{{ rag.text }}</p>
      <div class="cta-actions rag-section__actions">
        <a class="btn btn-primary" href="{% include helpers/internal-href.html path=rag.primary.link %}">{{ rag.primary.text }}</a>
        <a class="btn btn-secondary cta-actions__secondary" href="{% include helpers/internal-href.html path=rag.secondary.link %}">{{ rag.secondary.text }}</a>
      </div>
    </div>

    <div class="cards cards-3 rag-section__cards">
      {% for card in rag.cards %}
        <article class="card js-anim" data-anim="animate__fadeInUp" data-once="true">
          <p class="card-eyebrow">One Identity Copilot</p>
          <h3>{{ card.title }}</h3>
          <p>{{ card.text }}</p>
          <a class="btn btn-secondary" href="{% include helpers/internal-href.html path=card.link %}">{{ card.link_text }}</a>
        </article>
      {% endfor %}
    </div>
  </div>
</section>
