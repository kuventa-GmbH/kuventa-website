shared:
  booking_link: "/kontakt/"
  cta_text: "Ausgangslage kurz besprechen"
  cta_note: "Kurz schildern reicht. Sie sprechen direkt mit Dennis Kürschner."

identity-modernisierung:
  hero:
    kicker: "IGA-Modernisierung für Enterprise und gehobenen Mittelstand"
    title: "Identity Governance modernisieren und neu ausrichten"
    text: "Ordnen Sie Rollen, Berechtigungen, Governance und Plattformentscheidungen so, dass NIS2, SAP-IdM-Ablösung und Betrieb realistisch zusammenpassen."
    image: "/assets/img/illustrations/home/grow.svg"
    image_alt: "Illustration zur Modernisierung der Identity-Infrastruktur"
  sections:
    - template: "cards"
      heading: "Typische Probleme in Enterprise und gehobenem Mittelstand"
      intro: "Viele Unternehmen wachsen organisatorisch und technisch schneller als ihre IGA-Landschaft. Das erzeugt Reibung in Betrieb, Sicherheit, Revision und Modernisierung."
      items:
        - title: "Unklare Rollen und Zuständigkeiten"
          text: "Mitarbeitende, Fachbereiche und IT verlieren den Überblick darüber, wer worueber entscheidet und welche Zugriffe wirklich benoetigt werden."
          icon: "/assets/img/icons/circle.svg"
        - title: "Legacy-Prozesse und SAP-IdM-Druck"
          text: "Bestehende Systeme, Provisionierung und Berechtigungsmodelle sind historisch gewachsen und lassen sich nur schwer weiterentwickeln."
          icon: "/assets/img/icons/cap.svg"
        - title: "Fragmentierte Benutzerverwaltung"
          text: "Konten, Rollen und Zugriffe werden verteilt gepflegt und nur schwer konsistent gehalten."
          icon: "/assets/img/icons/search.svg"
        - title: "Uneinheitliche Kontrollen"
          text: "Rezertifizierung, Freigaben und Governance-Regeln sind nur teilweise eingefuehrt oder unterschiedlich umgesetzt."
          icon: "/assets/img/icons/star.svg"
        - title: "Plattformentscheidung steht an"
          text: "MidPoint, One Identity oder ein anderer Nachfolgepfad sollen eingeordnet werden, ohne vorschnell in einen Tool-Entscheid zu rutschen."
          icon: "/assets/img/icons/creative.svg"
      cta:
        alt: true
        title: "IGA modernisieren, bevor Komplexitaet steigt"
        text: "In einem kurzen Gespräch ordnen wir Ihre aktuelle Lage ein und zeigen erste Modernisierungsschritte auf."
    - template: "process"
      alt: true
      heading: "Warum fehlende Governance Modernisierung blockiert"
      text: "Moderne Organisationen brauchen nicht nur Standards, sondern eine belastbare Steuerung für Rollen, Berechtigungen, Integrationen und Verantwortlichkeiten."
      paragraph_links:
        - prefix: "Viele Unternehmen beginnen mit einem "
          link_text: "Identity Modernization Assessment"
          link: "/identity-assessment/"
          suffix: ", um ihre Ausgangslage sauber zu bewerten."
      subheading: "Moderne Zielarchitekturen brauchen"
      image: "/assets/img/illustrations/home/path.svg"
      points:
        - "klare Rollen- und Freigabemodelle"
        - "Joiner-Mover-Leaver und Rezertifizierung als steuerbare Prozesse"
        - "integrierte Zielsysteme, HR-Quellen und Verzeichnisdienste"
        - "ein realistisches Plattformbild fuer MidPoint, One Identity oder vergleichbare Loesungen"
      note: "Active Directory und lokale Benutzerkonten bleiben wichtige Quellen, sind allein aber selten die tragfaehige IGA-Zielarchitektur."
      cta:
        title: "Modernisierung beginnt bei Governance"
        text: "Wir bewerten, wo Ihre heutige Architektur und Ihr Betriebsmodell moderne IGA blockieren und welcher Plattformpfad fachlich passt."
    - template: "focus"
      heading: "Der IGA-Plattformansatz"
      text: "Eine tragfaehige IGA-Plattform verbindet Governance, Provisionierung und Integrationen. Dadurch koennen neue Systeme sauber angebunden und bestehende Prozesse schrittweise modernisiert werden."
      paragraph_links:
        - prefix: "Fuer interne Zugriffslandschaften betrachten wir haeufig eine "
          link_text: "Single Sign-On Plattform"
          link: "/sso-plattform/"
          suffix: "."
        - prefix: "Fuer IGA-Transformationen stehen haeufig "
          link_text: "MidPoint oder One Identity"
          link: "/identity-modernisierung/"
          suffix: " als Plattformkontexte im Raum."
      image: "/assets/img/illustrations/about/user.svg"
      columns:
        - title: "Architekturidee"
          lines:
            - "Benutzer"
            - "&darr;"
            - "IGA Plattform (z. B. MidPoint / One Identity)"
            - "&darr;"
            - "HR, Verzeichnisse, Zielsysteme und Fachanwendungen"
        - title: "Vorteile"
          points:
            - "mehr Transparenz fuer Rollen und Zugriffe"
            - "konsistente Governance ueber mehrere Systeme"
            - "tragfaehige Provisionierungs- und Kontrollprozesse"
            - "bessere Entscheidungsgrundlagen fuer Audit und NIS2"
      cta:
        alt: true
        title: "Von Insel-Loesungen zur tragfaehigen IGA-Plattform"
        text: "Wir planen mit Ihnen eine Zielarchitektur, die Governance, Betrieb und technische Integration sauber zusammenfuehrt."
    - template: "cards"
      alt: true
      heading: "Unsere Leistungen"
      intro: "Sie koennen mit einem Assessment starten oder direkt einen Umsetzungsweg fuer Governance und Plattformaufbau definieren."
      items:
        - title: "Identity Modernization Assessment"
          text: "Strukturierte Analyse Ihrer bestehenden Authentifizierungslandschaft mit Roadmap für die nächsten Schritte."
          icon: "/assets/img/icons/search.svg"
          link: "/identity-assessment/"
          link_text: "Mehr erfahren"
          link_as_button: true
        - title: "IGA-Plattform und Umsetzung"
          text: "Umsetzungsbegleitung fuer Governance-, Rollen- und Integrationsbausteine in MidPoint-, One-Identity- oder vergleichbaren Plattformkontexten."
          icon: "/assets/img/icons/cap.svg"
          link: "/sso-plattform/"
          link_text: "Mehr erfahren"
          link_as_button: true
        - title: "Governance-Betriebsmodell"
          text: "Rezertifizierung, Verantwortlichkeiten und Auditfaehigkeit dauerhaft im Alltag verankern."
          icon: "/assets/img/icons/creative.svg"
          link: "/customer-identity-plattform/"
          link_text: "Mehr erfahren"
          link_as_button: true
      cta:
        title: "Der richtige Einstieg hängt von Ihrer Ausgangslage ab"
        text: "Wir helfen Ihnen, Assessment, Plattformwahl und Betriebsmodell sauber voneinander abzugrenzen."
  final_cta:
    alt: true
    image: "/assets/img/photos/about/dennis.webp"
    icon: "/assets/img/icons/handshake.png"
    title: "Lassen Sie uns Ihr Vorhaben kurz besprechen"
    text: "Schildern Sie kurz die Ausgangslage. Ich melde mich persönlich zurück oder wir finden direkt einen passenden Termin."

identity-assessment:
  hero:
    kicker: "Identity Assessment fuer IGA, Governance und Modernisierung"
    title: "Identity Assessment fuer gewachsene Identity-Landschaften"
    text: "Ordnen Sie IGA, Rollen, Berechtigungen, Verantwortlichkeiten und Plattformoptionen so, dass NIS2, Audit, SAP-IdM-Ablösung und technische Realitaet sauber zusammenpassen."
    image: "/assets/img/illustrations/home/process.svg"
    image_alt: "Illustration fuer strukturierte Identity-Analyse"
  sections:
    - template: "cards"
      heading: "Wann ein Identity Assessment sinnvoll ist"
      intro: "Das Assessment ist fuer Unternehmen gedacht, die vor Entscheidungen stehen, aber zuerst ein belastbares Bild ihrer Ausgangslage, Risiken und realistischen Handlungsoptionen brauchen."
      items:
        - title: "NIS2-, Audit- oder Governance-Druck"
          text: "Es ist klar, dass Identity und Berechtigungen belastbar steuerbar werden muessen, aber Rollen, Verantwortlichkeiten und Nachweise sind nicht sauber geordnet."
          icon: "/assets/img/icons/circle.svg"
        - title: "SAP-IdM-Ablösung oder Plattformfrage"
          text: "MidPoint, One Identity oder ein anderer Pfad stehen im Raum, aber das Zielbild ist noch nicht klar genug fuer eine belastbare Entscheidung."
          icon: "/assets/img/icons/creative.svg"
        - title: "Gewachsene Berechtigungslandschaft"
          text: "Konten, Rollen, Freigaben und Zielsysteme sind historisch gewachsen und erzeugen Reibung zwischen IT, Fachbereichen, Revision und Betrieb."
          icon: "/assets/img/icons/search.svg"
        - title: "Keine gemeinsame Entscheidungsgrundlage"
          text: "Management, Architektur und Delivery sehen dieselben Probleme, priorisieren sie aber unterschiedlich und kommen dadurch nur schwer in einen geordneten Einstieg."
          icon: "/assets/img/icons/star.svg"
        - title: "Modernisierung ohne Big-Bang"
          text: "Sie brauchen einen realistischen Pfad, der Governance, Betrieb, Integrationen und technische Umsetzung zusammendenkt statt nur ein Tool zu pitchen."
          icon: "/assets/img/icons/cap.svg"
      cta:
        alt: true
        title: "Zuerst Klarheit, dann Plattform- oder Umsetzungsentscheidung"
        text: "Ein gutes Assessment reduziert Fehlentscheidungen und schafft eine tragfaehige Grundlage fuer Governance, Roadmap und Delivery."
    - template: "focus"
      alt: true
      heading: "Was wir im Assessment wirklich betrachten"
      text: "Wir analysieren nicht nur Technik, sondern die Verbindung aus Governance, Betriebsrealitaet, Architektur und Zielbild. Genau dort scheitern viele Vorhaben, wenn sie zu frueh in Tools oder Migrationen springen."
      paragraph_links:
        - prefix: "Aus dem Assessment entstehen haeufig konkrete Folgeprojekte wie eine "
          link_text: "IGA-Modernisierung"
          link: "/identity-modernisierung/"
          suffix: " oder ein belastbarer Plattformpfad fuer MidPoint oder One Identity."
      image: "/assets/img/illustrations/home/folders.svg"
      columns:
        - title: "Ist-Zustand"
          points:
            - "bestehende IGA-, Rollen- und Berechtigungsarchitektur"
            - "Identity-Quellen, Zielsysteme, HR- und Verzeichnisanbindungen"
            - "Freigabe-, Rezertifizierungs- und Verantwortlichkeitsmuster"
        - title: "Zielbild"
          points:
            - "Risiken, Luecken und Prioritaeten fuer Governance und Auditfaehigkeit"
            - "Integrationsfaehigkeit fuer SaaS, Zielsysteme und Modernisierung"
            - "Eignung fuer MidPoint, One Identity oder andere Plattformpfade"
      cta:
        title: "Assessment statt Tool-Pitch oder Bauchgefuehl"
        text: "Wir priorisieren die Themen, die fuer Governance, Audit, Betriebsfaehigkeit und Plattformentscheidungen wirklich tragen."
    - template: "cards"
      heading: "Was Sie aus dem Assessment mitnehmen"
      intro: "Sie erhalten keine abstrakte Bestandsaufnahme, sondern eine Entscheidungsgrundlage, mit der Management, Architektur und Umsetzung sinnvoll weiterarbeiten koennen."
      paragraph_links:
        - prefix: "Wenn aus der Analyse ein groesseres Transformationsvorhaben wird, folgt daraus haeufig eine "
          link_text: "IGA-Modernisierung"
          link: "/identity-modernisierung/"
          suffix: " oder ein konkreter Implementierungspfad."
      items:
        - title: "Architektur- und Ausgangslagenbild"
          text: "Transparente Einordnung Ihrer heutigen Identity-, Rollen-, Governance- und Integrationslandschaft."
          icon: "/assets/img/icons/search.svg"
        - title: "Risiko- und Handlungsfeldbewertung"
          text: "Einordnung der wichtigsten Risiken, Governance-Luecken und Reibungspunkte in Betrieb, Revision und Security."
          icon: "/assets/img/icons/star.svg"
        - title: "Zielbild und Plattformpfad"
          text: "Konkrete Einordnung, welcher Weg fuer MidPoint, One Identity oder einen anderen Plattformkontext fachlich sinnvoll ist."
          icon: "/assets/img/icons/cap.svg"
        - title: "Priorisierte Roadmap"
          text: "Schrittfolge fuer die naechsten technischen und organisatorischen Massnahmen statt Big-Bang-Migration."
          icon: "/assets/img/icons/train.svg"
        - title: "Klare naechste Schritte"
          text: "Orientierung, ob als naechstes eher Assessment-Vertiefung, Roadmap, Plattformentscheidung oder direkte Umsetzungsunterstuetzung sinnvoll ist."
          icon: "/assets/img/icons/bulb.svg"
      cta:
        alt: true
        title: "Damit aus Komplexitaet ein realistischer Plan wird"
        text: "Sie wissen danach, was zuerst geklaert, entschieden und umgesetzt werden sollte und welche Investitionen sich wirklich lohnen."
    - template: "steps"
      alt: true
      heading: "Wie das Assessment ablaeuft"
      text: "Das Assessment ist kompakt genug fuer schnelle Entscheidungen und tief genug fuer belastbare Architektur- und Governance-Arbeit."
      steps:
        - title: "Ausgangslage und Zielbild klaeren"
          text: "Wir erfassen Handlungsdruck, Rahmenbedingungen, relevante Systeme und die Betriebsrealitaet hinter dem Vorhaben."
        - title: "Architektur und Governance bewerten"
          text: "Wir betrachten Rollen, Freigaben, Verantwortlichkeiten, Zielsysteme, Quellen und Integrationsmuster im Zusammenhang."
        - title: "Risiken und Plattformpfade einordnen"
          text: "Wir bewerten, welche Risiken zuerst zaehlen und welche Plattform- oder Modernisierungspfade realistisch tragfaehig sind."
        - title: "Empfehlung und Roadmap ableiten"
          text: "Sie erhalten eine priorisierte Empfehlung fuer die naechsten Schritte mit belastbarer Entscheidungslogik."
      cta:
        title: "In kurzer Zeit zu einer belastbaren Entscheidungsgrundlage"
        text: "Im Erstgespraech klaeren wir, welcher Scope fuer Ihr Assessment sinnvoll ist und welche Fragen zuerst beantwortet werden muessen."
  final_cta:
    image: "/assets/img/photos/about/dennis.webp"
    icon: "/assets/img/icons/handshake.png"
    title: "Lassen Sie uns Ihre Ausgangslage kurz einordnen"
    text: "Schildern Sie kurz, ob NIS2, SAP-IdM-Ablösung, Governance-Druck oder eine gewachsene Identity-Landschaft gerade den Ausschlag geben. Ich melde mich persoenlich zurueck."
  more_solutions:
    alt: true
    heading: "Weitere Lösungen"
    intro: "Wenn die Ausgangslage klar ist, geht der naechste Schritt haeufig in die operative Modernisierung oder in einen konkreten Plattformpfad."
    items:
      - title: "IGA-Modernisierung"
        text: "Zielbild, Plattformpfad und priorisierte Modernisierung fuer MidPoint-, One-Identity- oder vergleichbare Vorhaben."
        icon: "/assets/img/icons/creative.svg"
        link: "/identity-modernisierung/"
        link_text: "Mehr erfahren"
        link_as_button: true
      - title: "Single Sign-On Plattform"
        text: "Zentrale Authentifizierung fuer interne Systeme, SaaS-Tools und APIs als moeglicher Baustein einer geordneten Zielarchitektur."
        icon: "/assets/img/icons/cap.svg"
        link: "/sso-plattform/"
        link_text: "Mehr erfahren"
        link_as_button: true

sso-plattform:
  hero:
    kicker: "Interne Zugriffslandschaften strukturieren"
    title: "Single Sign-On Plattform für interne Systeme"
    text: "Reduzieren Sie Administrationsaufwand und erhöhen Sie Sicherheit durch eine zentrale Authentifizierungsplattform."
  sections:
    - template: "cards"
      heading: "Das Problem"
      intro: "Getrennte Logins sind nicht nur unkomfortabel, sondern auch teuer im Betrieb und riskant für die Sicherheit."
      items:
        - title: "Unterschiedliche Logins"
          text: "Jedes System verwaltet eigene Zugangsdaten und eigene Anmeldeprozesse."
          icon: "/assets/img/icons/circle.svg"
        - title: "Passwort-Wiederverwendung"
          text: "Benutzer vereinfachen ihren Alltag mit unsicheren Passwortmustern."
          icon: "/assets/img/icons/star.svg"
        - title: "Hoher Helpdesk-Aufwand"
          text: "Passwort-Resets und Zugriffsprobleme erzeugen unnötige Supportkosten."
          icon: "/assets/img/icons/train.svg"
        - title: "Wenig Transparenz"
          text: "Zugriffsregeln und Authentifizierungswege sind über mehrere Systeme verteilt."
          icon: "/assets/img/icons/search.svg"
      cta:
        alt: true
        title: "SSO reduziert Reibung in Betrieb und Support"
        text: "Wir zeigen, wie eine zentrale Plattform die Zahl der Login-Inseln kontrolliert abbaut."
    - template: "process"
      alt: true
      heading: "Die Lösung"
      text: "Eine zentrale SSO- und Zugriffsplattform verbindet bestehende Identitaetsquellen mit internen Anwendungen, SaaS-Tools und APIs."
      paragraph_links:
        - prefix: "Viele Unternehmen beginnen mit einem "
          link_text: "Identity Modernization Assessment"
          link: "/identity-assessment/"
          suffix: ", bevor sie ihre zentrale Login-Plattform schrittweise einführen."
      subheading: "Typische Integrationen"
      image: "/assets/img/illustrations/home/security.svg"
      points:
        - "Active Directory als bestehende Benutzerquelle"
        - "interne Web-Applikationen und Portale"
        - "SaaS-Tools mit modernen Authentifizierungsstandards"
        - "interne APIs für tokenbasierte Zugriffe"
      note: "SAML, OpenID Connect und OAuth2 schaffen die technische Grundlage für eine saubere und zukunftsfähige Integration."
      cta:
        title: "Standards statt proprietärer Login-Lösungen"
        text: "Wir planen die Plattform so, dass bestehende Systeme angebunden und neue Anwendungen schneller integriert werden können."
    - template: "cards"
      heading: "Vorteile"
      intro: "Eine zentrale Plattform liefert operative Entlastung und verbessert gleichzeitig Sicherheit und Steuerbarkeit."
      items:
        - title: "Single Sign-On"
          text: "Weniger Passwörter, weniger Medienbrüche und bessere Nutzerakzeptanz."
          icon: "/assets/img/icons/bulb.svg"
        - title: "Multi-Faktor-Authentifizierung"
          text: "MFA wird zentral eingeführt und konsistent über mehrere Anwendungen durchgesetzt."
          icon: "/assets/img/icons/star.svg"
        - title: "Zentrale Zugriffskontrolle"
          text: "Policies, Sessions und Authentifizierungsflüsse werden an einer Stelle gesteuert."
          icon: "/assets/img/icons/search.svg"
        - title: "Einfacheres User Lifecycle Management"
          text: "Ein- und Austritte lassen sich besser mit bestehenden Benutzerquellen verzahnen."
          icon: "/assets/img/icons/circle.svg"
        - title: "Mehr Sicherheitskontrolle"
          text: "Authentifizierung wird nachvollziehbarer, standardisierter und auditfähiger."
          icon: "/assets/img/icons/cap.svg"
      cta:
        alt: true
        title: "SSO ist ein Sicherheits- und Betriebsprojekt"
        text: "Im Erstgespräch bewerten wir, welche Anwendungen sich für einen sinnvollen Einstieg eignen."
    - template: "steps"
      alt: true
      heading: "Typischer Projektumfang"
      text: "Viele Projekte starten mit einem klar abgegrenzten Scope und werden anschließend schrittweise erweitert."
      paragraph_links:
        - prefix: "Wenn auch externe Nutzer sicher angebunden werden sollen, ist oft eine "
          link_text: "Identity Governance Modernisierung"
          link: "/identity-modernisierung/"
          suffix: " oder ein Governance-Folgeprojekt der passende naechste Baustein."
      steps:
        - title: "Plattformbasis aufsetzen"
          text: "Aufbau der technischen Basis in Ihrer Zielumgebung."
        - title: "Active Directory Integration"
          text: "Anbindung der bestehenden Benutzerquelle für interne Nutzer."
        - title: "MFA Einrichtung"
          text: "Definition und technische Umsetzung passender MFA-Mechanismen."
        - title: "Integration erster Anwendungen"
          text: "Anbindung der wichtigsten Systeme für einen kontrollierten Start."
        - title: "Administrator Schulung"
          text: "Übergabe von Betriebswissen, Konfiguration und Governance-Grundlagen."
      cta:
        title: "Planen Sie den Einstieg mit realistischem Scope"
        text: "Wir helfen Ihnen, erste Anwendungen, Sicherheitsanforderungen und Betriebsmodell sauber festzulegen."
  final_cta:
    image: "/assets/img/illustrations/home/userlaptop.svg"
    icon: "/assets/img/icons/handshake.png"
    title: "Lassen Sie uns Ihr Vorhaben kurz besprechen"
    text: "Schildern Sie kurz die Ausgangslage. Ich melde mich persönlich zurück oder wir finden direkt einen passenden Termin."
  more_solutions:
    alt: true
    heading: "Weitere Lösungen"
    intro: "Je nach Ausgangslage ist ein vorgelagertes Assessment oder eine Plattform für externe Nutzer der logische Anschluss."
    items:
      - title: "Identity Modernization Assessment"
        text: "Strukturierte Analyse Ihrer bestehenden Authentifizierungslandschaft mit Roadmap für die nächsten Schritte."
        icon: "/assets/img/icons/search.svg"
        link: "/identity-assessment/"
        link_text: "Mehr erfahren"
        link_as_button: true
      - title: "Customer Identity Plattform"
        text: "Login-Plattform für Kunden-, Partner- und Entwicklerportale mit standardisierter Authentifizierung."
        icon: "/assets/img/icons/creative.svg"
        link: "/customer-identity-plattform/"
        link_text: "Mehr erfahren"
        link_as_button: true

customer-identity-plattform:
  hero:
    kicker: "Externe Nutzer sauber trennen"
    title: "Login Plattform für Kunden- und Partnerportale"
    text: "Skalierbare Authentifizierung für externe Nutzer wie Kunden, Partner oder Entwickler."
  sections:
    - template: "cards"
      heading: "Typische Anwendungsfälle"
      intro: "Wenn externe Nutzer sicher und konsistent auf digitale Angebote zugreifen sollen, braucht es eine eigene Identity-Architektur."
      items:
        - title: "Kundenportale"
          text: "Sichere Logins für Self-Service-, Vertrags- oder Serviceportale."
          icon: "/assets/img/icons/circle.svg"
        - title: "Partnerplattformen"
          text: "Kontrollierter Zugriff für externe Partner, Dienstleister oder Reseller."
          icon: "/assets/img/icons/creative.svg"
        - title: "SaaS Anwendungen"
          text: "Mandantenfähige Authentifizierung für Ihre eigenen digitalen Produkte."
          icon: "/assets/img/icons/cap.svg"
        - title: "Developer Portale"
          text: "Registrierung und Zugriff für Entwickler, Dokumentation und API-Nutzung."
          icon: "/assets/img/icons/search.svg"
        - title: "API Plattformen"
          text: "Tokenbasierte Sicherheit für Anwendungen und Integrationen."
          icon: "/assets/img/icons/star.svg"
      cta:
        alt: true
        title: "Externe Identitäten brauchen ein eigenes Plattformdenken"
        text: "Wir zeigen, wie sich Kunden-, Partner- und Entwicklerlogins standardisiert aufbauen lassen."
    - template: "process"
      alt: true
      heading: "Plattform Funktionen"
      text: "Eine Customer Identity Plattform stellt alle wesentlichen Login- und Self-Service-Funktionen zentral bereit."
      paragraph_links:
        - prefix: "Viele Unternehmen beginnen mit einem "
          link_text: "Identity Modernization Assessment"
          link: "/identity-assessment/"
          suffix: ", um interne und externe Identity-Anforderungen sinnvoll zu trennen."
      subheading: "Typische Bausteine"
      image: "/assets/img/illustrations/home/config.svg"
      points:
        - "Registrierung für neue Nutzer"
        - "Login und Session-Management"
        - "Passwort Reset und Account-Wiederherstellung"
        - "Multi-Faktor-Authentifizierung"
        - "OAuth2 und OpenID Connect"
        - "API Token Authentifizierung"
      note: "So entsteht eine Plattform, die Anwendungen entlastet und gleichzeitig ein konsistentes Login-Erlebnis schafft."
      cta:
        title: "Zentrale Funktionen statt individueller Login-Implementierungen"
        text: "Wir definieren mit Ihnen, welche Funktionen für Ihr Portal heute und mittelfristig benötigt werden."
    - template: "focus"
      heading: "Architektur"
      text: "Anwendungen authentifizieren Nutzer ueber eine zentrale Login-Plattform. Nach erfolgreicher Anmeldung erhalten Benutzer Tokens fuer den sicheren Zugriff auf Anwendungen und APIs."
      paragraph_links:
        - prefix: "Für interne Anwendungen implementieren wir häufig eine "
