faq:
  heading: "Häufige Fragen vor dem Erstgespräch"
  text: "Die häufigsten Einwände lassen sich meist schnell klären."
  items:
    - question: "Für wen ist das Identity Assessment gedacht?"
      answer: "Für Enterprise-Kunden und den gehobenen Mittelstand, die unter NIS2-, Audit-, Governance- oder SAP-IdM-Druck stehen und vor Investitionen zuerst eine belastbare Einordnung brauchen."
    - question: "Wann ist das Assessment der richtige erste Schritt?"
      answer: "Wenn die Ausgangslage unklar ist, mehrere Systeme und Verantwortlichkeiten ineinandergreifen oder Entscheidungen nicht auf Bauchgefühl basieren sollen."
    - question: "Was passiert im Erstgespräch?"
      answer: "Wir ordnen Handlungsdruck, Zielbild und aktuelle Risiken ein und prüfen, ob eher ein Identity Assessment, eine Roadmap oder direkte Umsetzungsunterstützung sinnvoll ist."

