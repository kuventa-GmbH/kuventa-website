hero:
  kicker: "Strategische Identity-Beratung für mittelständische Unternehmen"
  title: "Damit Identity kein Bremsfaktor für Wachstum, Sicherheit und Digitalisierung bleibt"
  text: "kuventa hilft Unternehmen dabei, gewachsene Zugriffs- und Authentifizierungslandschaften strategisch zu ordnen, Risiken zu reduzieren und eine belastbare Grundlage für moderne Anwendungen, Cloud-Vorhaben und sichere Geschäftsprozesse zu schaffen."
  image: "/assets/img/illustrations/home/path.svg"
  image_alt: "Illustration einer modernen Identity-Architektur"

why:
  image: "/assets/img/icons/thumb.svg"
  heading: "Woran Identity-Projekte in Unternehmen oft scheitern"
  items:
    - title: "Die Ausgangslage ist historisch gewachsen"
      text: "Benutzerquellen, Logins, Berechtigungen und Sicherheitsmechanismen sind über viele Systeme verteilt. Das erschwert Steuerung, Transparenz und Weiterentwicklung."
      icon: "/assets/img/icons/bulb.svg"
    - title: "Technische Komplexität blockiert Entscheidungen"
      text: "Wenn niemand mehr sauber erklären kann, wie Zugriffe, Integrationen und Sicherheitsvorgaben zusammenhängen, werden Projekte langsam und teuer."
      icon: "/assets/img/icons/cap.svg"
    - title: "Führungskräfte brauchen Klarheit statt Tool-Diskussionen"
      text: "Entscheider wollen wissen, welche Risiken bestehen, welche Prioritäten sinnvoll sind und wie eine tragfähige Modernisierung konkret abläuft."
      icon: "/assets/img/icons/creative.svg"
    - title: "Einzelmaßnahmen lösen das Grundproblem nicht"
      text: "SSO, MFA oder neue Integrationen bringen nur dann dauerhaft Nutzen, wenn sie in ein sauberes Zielbild, klare Verantwortlichkeiten und einen realistischen Umsetzungsplan eingebettet sind."
      icon: "/assets/img/icons/circle.svg"

services:
  heading: "Wie wir das Thema für Sie strategisch auflösen"
  blocks:
    - title: "Ausgangslage einordnen"
      points:
        - "Ist-Situation, Risiken und Engpässe transparent machen"
        - "geschäftliche Prioritäten mit technischen Abhängigkeiten verbinden"
        - "eine belastbare Entscheidungsgrundlage für das Management schaffen"
      icon: "/assets/img/icons/bulb.svg"
      link: "/identity-assessment/"
      link_text: "Mehr zum Einstieg"
    - title: "Zielbild und Roadmap entwickeln"
      points:
        - "ein realistisches Zielbild für Sicherheit, Skalierung und Integration definieren"
        - "Umsetzungsschritte nach Nutzen, Risiko und Aufwand priorisieren"
        - "Modernisierung ohne unnötigen Big-Bang planen"
      icon: "/assets/img/icons/search.svg"
      link: "/identity-modernisierung/"
      link_text: "Mehr zur Roadmap"
    - title: "Lösungen umsetzen"
      points:
        - "zentrale Zugriffs- und Authentifizierungsprozesse sauber einführen"
        - "bestehende Systeme, Verzeichnisdienste und neue Anwendungen pragmatisch anbinden"
        - "Betriebsmodell, Sicherheit und Nutzbarkeit gemeinsam denken"
      icon: "/assets/img/icons/cap.svg"
      link: "/sso-plattform/"
      link_text: "Mehr zur Umsetzung"
    - title: "Externe Zugriffe sicher gestalten"
      points:
        - "Kunden-, Partner- und Servicezugänge strukturiert aufsetzen"
        - "Registrierung, Self-Service und Zugriffsschutz verständlich gestalten"
        - "digitale Angebote sicher und skalierbar anschlussfähig machen"
      icon: "/assets/img/icons/creative.svg"
      link: "/customer-identity-plattform/"
      link_text: "Mehr zu externen Szenarien"

process:
  heading: "So läuft die Zusammenarbeit ab"
  text: "Die Zusammenarbeit ist so aufgebaut, dass auch komplexe technische Ausgangslagen für Management, IT-Leitung und Fachbereiche schnell verständlich und entscheidbar werden."
  sub-heading: "Der Ablauf in der Praxis"
  sub-text1:
    - "Wir klären zuerst Ziele, Risiken, Verantwortlichkeiten und technische Realität."
    - "Dann strukturieren wir die passende Lösung in ein verständliches Zielbild mit klaren Prioritäten."
    - "Anschließend begleiten wir die Umsetzung so, dass Betrieb, Sicherheit und Akzeptanz zusammenpassen."
    - "Dabei bleiben Entscheidungen nachvollziehbar und der Scope beherrschbar."
  sub-text2: "Sie erhalten keine abstrakte Architekturfolie, sondern einen umsetzbaren Weg mit sinnvollen nächsten Schritten."
  image: "/assets/img/illustrations/home/path.svg"
  primary_btn: "Lassen Sie uns kurz sprechen"
  primary_btn_link: "/kontakt/"
  primary_note: "Kurz schildern reicht. Ich melde mich persönlich zurück."

benefits:
  heading: "Welchen Nutzen Unternehmen daraus ziehen"
  cards:
    - title: "Weniger operative Reibung"
      points:
        - "weniger Login- und Berechtigungschaos"
        - "klarere Zuständigkeiten und Standards"
        - "geringerer Abstimmungs- und Supportaufwand"
      text: "Die IT wird entlastet, weil Zugriffsprozesse nachvollziehbarer, konsistenter und besser steuerbar werden."
      image: "/assets/img/illustrations/home/folders.svg"
    - title: "Mehr Sicherheit mit Augenmaß"
      points:
        - "einheitliche Sicherheitsvorgaben statt Einzellösungen"
        - "bessere Transparenz für Audit und Governance"
        - "weniger Risiken bei neuen Anwendungen und Integrationen"
      text: "Sicherheit wird nicht punktuell nachgerüstet, sondern als Bestandteil einer tragfähigen Gesamtarchitektur umgesetzt."
      image: "/assets/img/illustrations/home/userlaptop.svg"
    - title: "Schnellere Entscheidungen"
      points:
        - "klare Prioritäten für Budget und Ressourcen"
        - "realistische Roadmap statt technischer Wunschliste"
        - "greifbare Entscheidungsgrundlagen für Führungskräfte"
      text: "Management und IT-Leitung sehen, welche Schritte wirklich relevant sind und worauf zuerst investiert werden sollte."
      image: "/assets/img/illustrations/home/process.svg"
    - title: "Eine tragfähige Basis für Wachstum"
      points:
        - "bessere Vorbereitung auf Cloud-, Portal- und API-Vorhaben"
        - "saubere Anbindung neuer Systeme statt Sonderwege"
        - "schrittweise Modernisierung ohne Betriebsbruch"
      text: "Die Modernisierung schafft eine belastbare Grundlage für weitere Digitalisierungs- und Transformationsprojekte."
      image: "/assets/img/illustrations/home/security.svg"

climate:
  heading: "Warum Unternehmen uns dieses Thema anvertrauen"
  text: "kuventa verbindet technische Tiefe mit einem klaren Blick auf Umsetzbarkeit, Management-Relevanz und die Realität gewachsener Unternehmens-IT."
  image: "/assets/img/illustrations/home/userengagement.svg"
  items:
    - title: "Fokus auf reale Unternehmenslandschaften"
      text: "Wir arbeiten nicht für den Idealfall auf der grünen Wiese, sondern für gewachsene Umgebungen mit Alt-Systemen, Verzeichnisdiensten, neuen Anwendungen und organisatorischen Zwängen."
      icon: "/assets/img/icons/leaf.svg"
    - title: "Beratung und Umsetzung aus einem Guss"
      text: "Strategie, Zielbild und technische Umsetzung sind aufeinander abgestimmt. Dadurch entstehen keine Konzepte, die später im Betrieb scheitern."
      icon: "/assets/img/icons/train.svg"
    - title: "Kommunikation, die auch Nicht-Techniker mitnimmt"
      text: "Komplexe Zusammenhänge werden so aufbereitet, dass Geschäftsführung, IT-Leitung und Projektverantwortliche gemeinsam fundierte Entscheidungen treffen können."
      icon: "/assets/img/icons/search.svg"

contact:
  image: "/assets/img/icons/blue-bulb.svg"
  heading: "Lassen Sie uns Ihr Vorhaben kurz einordnen"
  text: "Wenn Sie klären möchten, wo die größten Risiken liegen, wie ein sinnvoller Einstieg aussieht oder welche nächsten Schritte jetzt wirklich Priorität haben, schreiben Sie mir kurz oder rufen Sie direkt an."
  primary_btn: "Strategiegespräch vereinbaren"
  primary_btn_link: "/kontakt/"
  note: "Kurz schildern reicht. Ich melde mich persönlich zurück."
