why:
  image: "/assets/img/icons/thumb.svg"
  heading: "Wann Unternehmen mit kuventa sprechen"
  text: "Diese Auslöser führen typischerweise dazu, dass ein strukturiertes Identity Assessment statt weiterer Ad-hoc-Maßnahmen sinnvoll wird."
  items:
    - title: "NIS2 ist bereits Realität"
      text: "Seit dem 06.12.2025 müssen betroffene Unternehmen Identity-, Zugriffs- und Governance-Themen belastbar einordnen und steuern können."
      icon: "/assets/img/icons/bulb.svg"
    - title: "SAP Identity Management muss ersetzt werden"
      text: "Wenn SAP IdM ausläuft, braucht es vor Tool- oder Migrationsentscheidungen zuerst ein realistisches Bild der heutigen IGA-, Rollen- und Berechtigungslandschaft."
      icon: "/assets/img/icons/cap.svg"
    - title: "Audit- und Governance-Druck steigt"
      text: "Rezertifizierung, Berechtigungstransparenz, Verantwortlichkeiten und NIS2-nahe Kontrollen sind oft nicht sauber genug dokumentiert oder steuerbar."
      icon: "/assets/img/icons/creative.svg"
    - title: "Niemand hat mehr das Gesamtbild"
      text: "Benutzerquellen, Rollen, Berechtigungen, Joiner-Mover-Leaver-Prozesse und Integrationen sind über viele Systeme verteilt. Das bremst Entscheidungen und erhöht Risiken."
      icon: "/assets/img/icons/circle.svg"

trust:
  heading: "Warum kuventa als erster Gesprächspartner funktioniert"
  text: "Vertrauen entsteht hier über belastbare Delivery-Erfahrung, sichtbare One-Identity-Nähe und eine klare kuventa-Verantwortung vom Erstgespräch bis zur Umsetzung."
  items:
    - title: "Klare Verantwortung bei kuventa"
      text: "Die Anfrage landet nicht in einem anonymen Vertriebstrichter. kuventa ordnet die Lage fachlich ein und übernimmt die weitere Strukturierung."
    - title: "One Identity mit Delivery-Perspektive"
      text: "Nicht nur Architekturfolie, sondern Erfahrung aus Synchronisation, Governance, Rezertifizierung, Web-Frontend, SuccessFactors- und Zielsystem-Kontexten."
    - title: "Marktzugang im One-Identity-Umfeld"
      text: "Kontakte zu Beratungshäusern, Herstellerseite und One-Identity-nahen Kundenkontexten helfen dabei, Markt- und Plattformrealität sauber einzuordnen."
    - title: "Hamburg / Norden"
      text: "kuventa ist in Hamburg verankert und arbeitet nah an mittelständischen Unternehmen mit realen Betriebs- und Governance-Fragen."
    - title: "Pragmatisch bis in die Umsetzung"
      text: "Assessment, Roadmap, Produktidee und technische Umsetzung greifen ineinander, damit Entscheidungen nicht in PowerPoint stecken bleiben."
services:
  heading: "Identity Assessment als sinnvoller Einstieg"
  text: "Bei Handlungsdruck schafft zuerst ein Assessment Klarheit. Danach folgen Zielbild, Roadmap, Umsetzung und bei Bedarf ein MCP-gestützter One Identity Copilot für Analyse, Dokumentation und Delivery."
  blocks:
    - eyebrow: "Empfohlener erster Schritt"
      featured: true
      title: "Identity Assessment"
      points:
        - "Ausgangslage technisch und organisatorisch einordnen"
        - "Risiken, Reibung und Handlungsdruck sichtbar machen"
        - "priorisierte Empfehlungen und nächste Schritte ableiten"
      icon: "/assets/img/icons/bulb.svg"
      link: "/identity-assessment/"
      link_text: "Identity Assessment ansehen"
    - title: "Roadmap und Zielbild"
      points:
        - "ein realistisches Zielbild für Governance, Architektur und Betrieb entwickeln"
        - "Modernisierungsschritte nach Nutzen, Risiko, NIS2-Relevanz und Aufwand priorisieren"
        - "Management und IT auf eine gemeinsame Entscheidungsbasis bringen"
      icon: "/assets/img/icons/search.svg"
      link: "/identity-modernisierung/"
      link_text: "Zur Modernisierung"
    - title: "IGA-Umsetzung und Plattformaufbau"
      points:
        - "Governance-, Rollen- und Integrationsbausteine sauber einführen"
        - "bestehende Verzeichnisdienste, HR-Quellen und Anwendungen anbinden"
        - "MidPoint- oder One-Identity-Kontexte technisch und organisatorisch tragfähig aufsetzen"
      icon: "/assets/img/icons/cap.svg"
      link: "/identity-modernisierung/"
      link_text: "Zur Umsetzung"
    - title: "One Identity Copilot"
      points:
        - "Analyse, Dokumentation und Delivery in gewachsenen One-Identity-Umgebungen beschleunigen"
        - "kundenspezifische Logiken, Objekte und Wissen gezielter nutzbar machen"
        - "Teams schneller an belastbare Antworten und technische Transparenz bringen"
      icon: "/assets/img/icons/train.svg"
      link: "/identity-copilot/"
      link_text: "Zum Copilot"

