intro:
  title: "IGA-Berater mit technischer Tiefe"
  text: "Mein Name ist Dennis Kürschner, ich komme aus Hamburg und begleite Unternehmen als spezialisierter IGA- und Identity-Berater bei anspruchsvollen Governance- und Modernisierungsvorhaben."
  text2: "Mein Schwerpunkt liegt auf Identity Governance, Rollen- und Berechtigungsmodellen, Rezertifizierung, NIS2-naher Audit-Readiness sowie der technischen Umsetzung in anspruchsvollen Enterprise- und Mittelstands-Umfeldern."
