      steps:
        - title: "Wissensquellen priorisieren"
          text: "Zuerst wird entschieden, welche One-Identity-Dokumente, Projekttypen und Kundenkontexte wirklich in den Kernbestand gehören."
        - title: "Antwortgrenzen definieren"
          text: "Quellen, Freigaben, Zitierlogik und sensible Inhalte müssen sauber begrenzt werden, bevor der Bereich skaliert."
        - title: "Pilot-Use-Cases testen"
          text: "Presales, Berater-Onboarding und Delivery-Sparring eignen sich als erste, kontrollierbare Anwendungsfälle."
