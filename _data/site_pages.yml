beraterprofil:
  hero:
    kicker: "Technische Führung"
    title: "Gründer, Lead IGA Consultant und One-Identity-Praktiker"
    text: "Dennis Kürschner begleitet Identity-Projekte mit Fokus auf IGA, Governance, Architektur, Integration und technische Umsetzung. Der Schwerpunkt liegt auf One Identity, Modernisierung gewachsener Landschaften und Projekten, in denen fachliche Klarheit bis in Delivery und Betriebsrealität tragen muss."
