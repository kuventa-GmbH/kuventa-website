            - "neue Berater schneller produktiv machen"
            - "Wissen aus Senior Delivery breiter nutzbar machen"
            - "Abhängigkeit von Einzelpersonen verringern"
        - title: "Delivery"
          points:
            - "Wiederverwendung von Lösungswissen verbessern"
            - "Projektvorbereitung und Kontextwechsel beschleunigen"
            - "Fehler durch fragmentiertes Wissen reduzieren"
        - title: "Presales und Markt"
          points:
            - "schneller belastbare One-Identity-Perspektiven formulieren"
