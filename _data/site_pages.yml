    image: "/assets/img/photos/about/hero.webp"
    icon: "/assets/img/icons/handshake.png"
    title: "Direkt mit dem Lead IGA Consultant sprechen"
    text: "Im Erstgespräch besprechen wir Ihre aktuelle IGA-Landschaft, mögliche Zielbilder und einen sinnvollen ersten Scope."
    show_note_below: true
