leistungen:
  hero:
    kicker: "Beratung und Implementierung"
    title: "Leistungen für IGA, NIS2 und Identity-Modernisierung"
    text: "kuventa unterstützt Enterprise-Kunden und den gehobenen Mittelstand von der Analyse bis zur Umsetzung. Alle Leistungen sind auf Identity Governance, SAP-IdM-Ablösung, NIS2-nahe Steuerung und belastbare Zielarchitekturen ausgerichtet."
    image: "/assets/img/illustrations/home/grow.svg"
    image_alt: "Illustration zu Leistungen für Identity-Infrastrukturen"
  sections:
    - template: "cards"
      heading: "Unsere Leistungen"
      intro: "Die Leistungen bauen aufeinander auf und können je nach Ausgangslage als Assessment, Architekturprojekt oder Implementierung starten."
      items:
        - title: "IGA-Modernisierung"
          text: "Zielbild und Modernisierungsstrategie für Governance, Rollen, Prozesse und tragfähige Identity-Architekturen."
          icon: "/assets/img/icons/bulb.svg"
          points:
            - "Zentrale Authentifizierung statt Login-Inseln"
            - "Schrittweise Modernisierung historisch gewachsener Landschaften"
            - "Vorbereitung auf Cloud- und API-Architekturen"
          link: "/identity-modernisierung/"
          link_text: "Mehr erfahren"
          link_as_button: true
        - title: "Identity Assessment"
          text: "Strukturierte Analyse der aktuellen Authentifizierungslandschaft mit Roadmap für die nächsten Entscheidungen."
          icon: "/assets/img/icons/search.svg"
          points:
            - "Ist-Zustand transparent machen"
            - "Sicherheits- und Integrationsrisiken bewerten"
            - "Priorisierte Roadmap ableiten"
          link: "/identity-assessment/"
          link_text: "Mehr erfahren"
          link_as_button: true
        - title: "IGA-Plattform und Umsetzung"
          text: "Umsetzungsbegleitung für Governance-, Rollen- und Integrationsbausteine in MidPoint-, One-Identity- oder vergleichbaren Plattformkontexten."
          icon: "/assets/img/icons/cap.svg"
          points:
            - "Single Sign-On für interne Nutzer"
            - "Anbindung von AD, LDAP und SaaS"
            - "Konsistente MFA und zentrale Policies"
          link: "/sso-plattform/"
          link_text: "Mehr erfahren"
          link_as_button: true
        - title: "Betriebsnahe Governance"
          text: "Rezertifizierung, Verantwortlichkeiten, Auditfähigkeit und Betriebsmodell sauber in den Alltag überführen."
          icon: "/assets/img/icons/creative.svg"
          points:
            - "Self-Service und Registrierungsprozesse"
            - "Tokenbasierte Sicherheit für Anwendungen und APIs"
            - "Skalierbare externe Identitäten"
          link: "/customer-identity-plattform/"
          link_text: "Mehr erfahren"
          link_as_button: true
    - template: "focus"
      alt: true
      heading: "Wann welche Leistung passt"
      text: "Nicht jedes Vorhaben startet am selben Punkt. Entscheidend ist, ob zuerst Transparenz fehlt oder bereits eine konkrete Zielplattform aufgebaut werden soll."
      image: "/assets/img/illustrations/about/user.svg"
      columns:
        - title: "Assessment"
          text: "Wenn die bestehende Landschaft bewertet und priorisiert werden muss."
          points:
            - "Ist-Analyse und Handlungsfelder"
            - "Roadmap für Folgeprojekte"
            - "Belastbare Entscheidungsgrundlage"
        - title: "IGA und interne Steuerung"
          text: "Wenn Rollen, Berechtigungen, Rezertifizierung und Lifecycle-Prozesse sauber aufgebaut werden müssen."
          points:
            - "Joiner-Mover-Leaver"
            - "Rezertifizierung"
            - "Governance und Verantwortlichkeiten"
        - title: "Plattformumsetzung"
          text: "Wenn MidPoint, One Identity oder ein Nachfolgepfad für SAP IdM technisch und organisatorisch sauber aufgesetzt werden sollen."
          points:
            - "Plattformbewertung"
            - "Integrationen"
            - "Betriebsmodell"
    - template: "steps"
      heading: "Typischer Einstieg"
      text: "Viele Mandate beginnen mit einer klaren Einordnung der Ausgangslage und werden dann in einen überschaubaren ersten Scope überführt."
      steps:
        - title: "Ausgangslage aufnehmen"
          text: "Wir erfassen Systeme, Nutzergruppen, Integrationen und aktuelle Engpässe."
        - title: "Zielbild definieren"
          text: "Wir strukturieren die passende Identity-Architektur für Ihre IT-Landschaft."
        - title: "Scope priorisieren"
          text: "Der erste Umsetzungsumfang wird nach Nutzen, Risiko und Machbarkeit zugeschnitten."
        - title: "Schrittweise einführen"
          text: "Integration, Betriebsmodell und Wissenstransfer werden von Anfang an mitgedacht."
    - template: "cards"
      alt: true
      heading: "Business-Nutzen"
      intro: "Die Leistungen sind darauf ausgerichtet, Betrieb zu entlasten, Sicherheit zu verbessern und Architekturentscheidungen zu vereinfachen."
      items:
        - title: "Weniger Berechtigungschaos"
          text: "Saubere Governance reduziert Medienbrüche, Sonderfälle und Abstimmungsaufwand."
          icon: "/assets/img/icons/circle.svg"
        - title: "Mehr Sicherheitskontrolle"
          text: "Kontrollen, Rezertifizierungen und Verantwortlichkeiten werden konsistent steuerbar."
          icon: "/assets/img/icons/star.svg"
        - title: "Bessere Integrationsfähigkeit"
          text: "Neue Anwendungen, HR-Quellen und Zielsysteme lassen sich standardisiert anbinden."
          icon: "/assets/img/icons/train.svg"
        - title: "Belastbare Zielarchitektur"
          text: "Identity wird zu einem Architekturbaustein für weitere Cloud- und Plattforminitiativen."
          icon: "/assets/img/icons/search.svg"
  final_cta:
    image: "/assets/img/illustrations/home/userlaptop.svg"
    icon: "/assets/img/icons/handshake.png"
    title: "Passenden Einstieg für Ihr Vorhaben klären"
    text: "Im Erstgespräch klären wir, ob Assessment, IGA-Modernisierung, SAP-IdM-Ablösung oder Plattformumsetzung der richtige Einstieg ist."
    show_note_below: true

loesungen:
  hero:
    kicker: "Typische Kundenprobleme"
    title: "Lösungen für gewachsene Identity-Landschaften"
    text: "Viele Unternehmen haben keine isolierte IAM-Aufgabe, sondern eine historisch gewachsene IGA-, Rollen- und Berechtigungslandschaft. kuventa strukturiert daraus ein belastbares Zielbild für Governance, Modernisierung und Umsetzung."
    image: "/assets/img/illustrations/home/security.svg"
    image_alt: "Illustration zu Lösungen für Identity-Landschaften"
  sections:
    - template: "cards"
      heading: "Typische Ausgangslagen"
      intro: "Diese Situationen sind häufig der Auslöser für ein Identity-Modernisierungsvorhaben."
      items:
        - title: "Unklare Verantwortlichkeiten"
          text: "Anträge, Freigaben und Rollenpflege laufen über viele Stellen verteilt, was Betrieb und Revision belastet."
          icon: "/assets/img/icons/circle.svg"
        - title: "SAP IdM muss ersetzt werden"
          text: "Die bestehende Landschaft ist gewachsen, aber ein belastbarer Nachfolgepfad für IGA und Provisionierung fehlt."
          icon: "/assets/img/icons/cap.svg"
        - title: "Uneinheitliche Kontrollen"
          text: "Rezertifizierungen, Rollenmodelle und Governance-Regeln sind nur teilweise definiert oder inkonsistent umgesetzt."
          icon: "/assets/img/icons/star.svg"
        - title: "Fehlende Transparenz"
          text: "Trust-Beziehungen, Login-Flows und Zuständigkeiten sind über viele Systeme verteilt."
          icon: "/assets/img/icons/search.svg"
        - title: "NIS2 erhöht den Druck"
          text: "Management und IT müssen Zugriffe, Verantwortlichkeiten und Schutzmaßnahmen nachvollziehbar steuern können."
          icon: "/assets/img/icons/creative.svg"
        - title: "Plattformentscheidung steht an"
          text: "MidPoint, One Identity oder ein anderer Pfad sollen eingeordnet werden, ohne in Tool-Mode oder Aktionismus zu kippen."
          icon: "/assets/img/icons/train.svg"
    - template: "process"
      alt: true
      heading: "Was moderne IGA leisten muss"
      text: "Eine moderne IGA-Landschaft muss Governance, Integrationsfähigkeit, Auditfähigkeit und Betriebsrealität gleichzeitig abdecken."
      subheading: "Worauf es ankommt"
      image: "/assets/img/illustrations/home/path.svg"
      points:
        - "klare Rollen-, Verantwortungs- und Freigabemodelle"
        - "Joiner-Mover-Leaver und Rezertifizierung als beherrschbare Prozesse"
        - "saubere Integration von HR, Verzeichnisdiensten, Zielsystemen und Fachanwendungen"
        - "ein Betriebsmodell, das NIS2, Audit und Alltag zusammenbringt"
      note: "Das Ziel ist keine isolierte Tool-Einführung, sondern eine belastbare IGA-Struktur fuer weitere Architekturentscheidungen."
    - template: "cards"
      heading: "Passende Lösungsansätze"
      intro: "Je nach Ausgangslage beginnt die Lösung mit Analyse, interner Plattform oder externer Identity."
      items:
        - title: "IGA-Modernisierung"
          text: "Für Unternehmen, die ihre Governance-, Rollen- und Berechtigungslandschaft strategisch und technisch neu ausrichten wollen."
          icon: "/assets/img/icons/bulb.svg"
          link: "/identity-modernisierung/"
          link_text: "Mehr erfahren"
          link_as_button: true
        - title: "Identity Assessment"
          text: "Für Vorhaben, die zuerst Transparenz und eine priorisierte Roadmap benötigen."
          icon: "/assets/img/icons/search.svg"
          link: "/identity-assessment/"
          link_text: "Mehr erfahren"
          link_as_button: true
        - title: "Plattformumsetzung"
          text: "Für Unternehmen, die MidPoint, One Identity oder einen geordneten Nachfolgepfad in die Umsetzung bringen wollen."
          icon: "/assets/img/icons/cap.svg"
          link: "/sso-plattform/"
          link_text: "Mehr erfahren"
          link_as_button: true
        - title: "Governance-Betriebsmodell"
          text: "Für Unternehmen, die IGA nicht nur einführen, sondern dauerhaft im Betrieb verankern wollen."
          icon: "/assets/img/icons/creative.svg"
          link: "/customer-identity-plattform/"
          link_text: "Mehr erfahren"
          link_as_button: true
    - template: "focus"
      alt: true
      heading: "Ergebnis einer sauberen IGA-Architektur"
      text: "Wenn Identity Governance tragfähig aufgebaut wird, verbessern sich nicht nur Kontrollen und Transparenz, sondern die gesamte Steuerbarkeit der IT-Landschaft."
      image: "/assets/img/illustrations/home/config.svg"
      columns:
        - title: "Betrieb"
          points:
            - "weniger Supportaufwand"
            - "weniger Sonderfälle und manuelle Freigaben"
            - "klarere Zuständigkeiten"
        - title: "Sicherheit"
          points:
            - "konsistente Kontrollen"
            - "nachvollziehbare Policies"
            - "bessere Nachvollziehbarkeit"
        - title: "Cloud Readiness"
          points:
            - "schnellere Anbindung neuer Anwendungen"
            - "tragfähige Plattformpfade mit MidPoint oder One Identity"
            - "saubere Grundlage für weitere Modernisierung"
  final_cta:
    image: "/assets/img/illustrations/home/process.svg"
    icon: "/assets/img/icons/handshake.png"
    title: "Ausgangslage einordnen und Lösungsweg festlegen"
    text: "Im Erstgespräch strukturieren wir, welche Probleme heute die größte Reibung erzeugen und welcher Einstieg für IGA, Plattformwahl und Modernisierung sinnvoll ist."
    show_note_below: true

