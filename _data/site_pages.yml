        - title: "Qualitätssicherung"
          text: "Antworten brauchen Quellen, Review-Mechanismen und eine klare Grenze zwischen Recherchehilfe und verbindlicher Projektaussage."
          icon: "/assets/img/icons/search.svg"
        - title: "Produkt- statt Tool-Denken"
          text: "Entscheidend ist nicht der Chat an sich, sondern der wiederkehrende Geschäftsnutzen für Delivery, Onboarding und Presales."
          icon: "/assets/img/icons/bulb.svg"
        - title: "Sauberer Pilot"
          text: "Ein eingegrenzter erster Scope mit wenigen Quellarten und klaren Erfolgskriterien ist sinnvoller als ein zu breiter Wissenscontainer."
