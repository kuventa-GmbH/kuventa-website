rag-fuer-berater:
  hero:
    kicker: "Unterseite"
    title: "KI-Wissensassistent für One-Identity-Berater"
    text: "Für Berater zählt Geschwindigkeit ohne Qualitätsverlust. Der Bereich hilft dabei, schneller in Tabellen, Zielsysteme, Rollenlogiken und typische Umsetzungsfragen einzusteigen."
    image: "/assets/img/illustrations/home/userlaptop.svg"
    image_alt: "Illustration für Berater im Delivery-Kontext"
  sections:
    - template: "cards"
      heading: "Typische Mehrwerte im Berateralltag"
      intro: "Gerade in frühen Projektphasen und bei Kontextwechseln entsteht viel Such- und Abstimmungsaufwand."
      items:
        - title: "Schnelleres Onboarding"
          text: "Neue Berater kommen schneller in projektrelevante Begriffe, Rollenmodelle, Zielsysteme und One-Identity-Logiken."
          icon: "/assets/img/icons/star.svg"
        - title: "Weniger Suchzeit"
          text: "Wissen aus Handbüchern, Projektnotizen und internen Patterns wird schneller auffindbar statt über Dateien und Personen verteilt zu bleiben."
          icon: "/assets/img/icons/search.svg"
        - title: "Belastbarere Antworten"
          text: "Antworten können auf definierte Quellen zurückgeführt und fachlich eingeordnet werden, statt aus Bauchgefühl zu entstehen."
          icon: "/assets/img/icons/bulb.svg"
        - title: "Besseres Sparring"
          text: "Der RAG ersetzt keine Seniorität, kann aber die Vorbereitung auf Workshops, Troubleshooting und Delivery deutlich beschleunigen."
          icon: "/assets/img/icons/circle.svg"
    - template: "process"
      alt: true
      heading: "Sinnvolle Einsatzmuster"
      text: "Nicht jede Frage eignet sich gleich gut. Am meisten hilft der Bereich dort, wo Berater schnell Fachkontext und Quellenzugriff brauchen."
      subheading: "Beispiele"
      image: "/assets/img/illustrations/home/path.svg"
      points:
        - "Verständnis für Tabellen, Prozesse, Rollen und Customizing beschleunigen"
        - "bekannte Lösungsansätze und Projekterfahrungen schneller wiederverwenden"
        - "Workshops, Analysen und technische Umsetzung besser vorbereiten"
        - "vorhandenes Wissen aus Handbüchern und Kundendokumentation zusammenführen"
      note: "Je kritischer eine Aussage für Design oder Produktion ist, desto wichtiger bleiben Quellenprüfung und Senior Review."
