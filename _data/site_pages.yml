      image: "/assets/img/illustrations/about/security.svg"
      columns:
        - title: "One Identity und IGA"
          points:
            - "OneIM Sync Editor, Manager, Designer und Web-Designer-Kontexte"
            - "Rollen, Rezertifizierung, SoD und Governance-Prozesse"
            - "One Identity in Modernisierungs-, Betriebs- und Kundenkontexten"
        - title: "Integrationen und Delivery"
          points:
            - "Active Directory, HR-Quellen, Zielsysteme und Fachanwendungen"
            - "SuccessFactors-, CSV- und kundenspezifische Integrationspfade"
            - "Deployment, Testbeschleunigung und produktionsnahe Übergänge"
        - title: "Projektarbeit und Produktisierung"
          points:
            - "Assessment und Discovery Workshops"
            - "Architekturentscheidungen und Integrationskonzepte"
            - "technische Begleitung bis in die Umsetzung"
            - "RAG-/Knowledge-Accelerator-Denken für wiederverwendbares Projektwissen"
    - template: "cards"
      alt: true
      heading: "Erfahrung aus komplexen Umgebungen"
      intro: "Die Arbeitsschwerpunkte liegen in Unternehmensumgebungen, in denen Security, Integrationen, Plattformlogik und Betriebsrealität eng zusammenspielen."
      items:
        - title: "dmTECH und Handel"
          text: "Kassen- und Backoffice-Umstellungen, Sync-Erweiterungen und SuccessFactors-nahe Anbindung im One-Identity-Umfeld."
          icon: "/assets/img/icons/star.svg"
        - title: "Allianz und Versicherungsumfeld"
          text: "GIAM-Frontend, SoD-Planung und Reconciliation-Kontexte in sicherheits- und governancekritischen Umfeldern."
          icon: "/assets/img/icons/circle.svg"
        - title: "Computacenter und Industrie"
          text: "Technische Identitäten, HR-Schnittstellen, wiederverwendbare Sync-Spezifikationen und produktionsnahe One-Identity-Implementierung."
          icon: "/assets/img/icons/cap.svg"
        - title: "Munich Re, SERGO und BDO"
          text: "Von Web-Designer-/Attestierungs-Themen bis zu .NET-, CI/CD- und Portalprojekten mit Architektur- und Produktnähe."
          icon: "/assets/img/icons/creative.svg"
    - template: "steps"
      heading: "Rolle im Projekt"
      text: "Technische Führung bedeutet, Architekturentscheidungen mit Umsetzbarkeit, Delivery-Geschwindigkeit und Betrieb zusammenzubringen."
      steps:
        - title: "Ausgangslage strukturieren"
          text: "Systeme, Authentifizierungswege, Integrationen und Risiken werden sauber eingeordnet."
        - title: "Zielarchitektur definieren"
          text: "Die zukünftige Identity-Plattform wird auf Standards, Betriebsmodell und Migrationspfad ausgerichtet."
        - title: "Umsetzung begleiten"
          text: "Konfiguration, Integrationen und technische Entscheidungen werden bis in Einführung, Test und Betriebsübergang begleitet."
        - title: "Wissen übertragen"
          text: "Administrations-, Projekt- und Betriebswissen wird so aufbereitet, dass Delivery intern tragfähig und wiederverwendbar bleibt."
    - template: "cards"
