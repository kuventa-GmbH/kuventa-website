      items:
        - title: "Presales-Sparring"
          text: "Angebote, Kundengespräche und Erstbewertung von One-Identity-Kontexten lassen sich schneller vorbereiten."
          icon: "/assets/img/icons/star.svg"
        - title: "Berater-Onboarding"
          text: "Neue Teammitglieder verstehen projekt- und produktspezifische Grundlagen schneller und mit weniger Senior-Bindung."
          icon: "/assets/img/icons/circle.svg"
        - title: "Delivery-Nachschlagewerk"
          text: "Bekannte Projektmuster, Zielsystemfragen und Dokumentationswissen bleiben schneller greifbar."
          icon: "/assets/img/icons/search.svg"
        - title: "Interne Wissenskonservierung"
          text: "Wissen aus Projekten geht beim Rollenwechsel oder nach Projektende nicht sofort verloren."
          icon: "/assets/img/icons/bulb.svg"
    - template: "cards"
