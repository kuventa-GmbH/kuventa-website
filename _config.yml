# Site settings
title: kuventa GmbH
email: info@kuventa.de
description: >- # this means to ignore newlines until "baseurl:"
  Engineering für One Identity Manager: Modulentwicklung, Troubleshooting
  und Expertenverstärkung. Plus kubo, der KI-Assistent, der deine
  OneIM-Umgebung versteht. On-Prem, read-only, aus Hamburg.
baseurl: ""
url: "https://kuventa.de"

# Build settings
plugins:
  - jekyll-feed

# Exclude from processing.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - tmp/
  - docs/
  - scripts/
  - README.md
